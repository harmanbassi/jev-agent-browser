name: Test public distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full history with checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$scan_dir"
          (cd "$scan_dir" && sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt)
          tar -xzf "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --no-banner --log-opts=--all .
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - run: python -m coverage run -m pytest tests
      - run: python -m coverage report --fail-under=80
      - run: python -m build
      - name: Installed wheel with disposable direct browser (no paid API calls)
        run: JEV_FUNCTIONAL=1 python -m pytest tests/test_functional.py -q
