name: jev_browser
version: 0.2.2
description: >
  browser_task: TypeSafe's Jev decision model (via OpenRouter) drives the
  existing Camofox tab towards a goal and pauses back to the agent when it
  needs guidance. The browser_* tools stay as the fallback on the same tab.
provides_tools:
  - browser_task
requires_env: []
optional_env:
  - name: JEV_OPENROUTER_KEY
    description: "OpenRouter key for Jev decisions and the text helper (falls back to OPENROUTER_API_KEY)."
    prompt: "OpenRouter key for Jev (or empty to reuse OPENROUTER_API_KEY)"
    password: true
